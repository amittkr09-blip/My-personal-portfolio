<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amit — Full Stack Developer</title>
    <meta name="description" content="Portfolio of Amit, a Frontend Developer and BCA student building clean, responsive, and effortless web experiences." />

    <!-- Synchronous theme initializer: defaults to light mode -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('portfolio-theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>

    <!-- Google Fonts: Space Grotesk, Plus Jakarta Sans, Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#FAF7EE] dark:bg-[#0E0E10] text-[#161616] dark:text-[#F3F3F3] antialiased selection:bg-[#D35433] selection:text-white">

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
